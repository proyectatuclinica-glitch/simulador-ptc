<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de resultado</title>
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Color de marca: cambia estos dos valores y todo el diseño
     se adapta (botón, brillo de fondo, marca del slider, etc.)
     ============================================================ */
  :root {
    --brand-1: #4728A2;   /* color principal de marca */
    --brand-2: #19A8B3;   /* color secundario (degradado) */

    --bg: #141929;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #f5f6f8;
    --muted: #8b8f9a;
    --muted-2: #55585f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Brillo suave de fondo, tipo pagina de producto */
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translateX(-50%);
    background: radial-gradient(circle, color-mix(in srgb, var(--brand-1) 22%, transparent) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { width: 100%; max-width: 560px; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 40px; }
  .logo-img { max-height: 42px; max-width: 220px; margin: 0 auto 18px; display: block; }
  .logo-fallback {
    display: none;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
    font-weight: 600;
  }
  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 6px 0 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  label.field-label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 500;
  }

  /* Selector de caso: segmented control */
  .segmented {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .segmented button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 8px;
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .segmented button.active {
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    color: white;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--brand-1) 45%, transparent);
  }

  /* Zona de subida */
  .dropzone {
    border: 1.5px dashed var(--panel-border);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--brand-1);
    background: color-mix(in srgb, var(--brand-1) 6%, transparent);
  }
  .dropzone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .dropzone .icon {
    width: 36px; height: 36px; margin: 0 auto 12px;
    color: var(--muted);
  }
  .dropzone .dz-text { font-size: 0.88rem; color: var(--text); font-weight: 500; }
  .dropzone .dz-sub { font-size: 0.78rem; color: var(--muted-2); margin-top: 4px; }
  .dropzone.has-file .dz-preview {
    width: 100%; max-height: 180px; object-fit: contain; border-radius: 10px; margin-bottom: 10px;
  }

  button#generateBtn {
    width: 100%;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    color: white;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--brand-1) 35%, transparent);
  }
  button#generateBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 30px color-mix(in srgb, var(--brand-1) 45%, transparent); }
  button#generateBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .status-row {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-top: 16px; min-height: 20px; font-size: 0.85rem; color: var(--muted);
  }
  .dots { display: flex; gap: 5px; }
  .dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    animation: pulse 1.1s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); } 40% { opacity: 1; transform: scale(1); } }

  /* Comparador antes/despues */
  .compare-wrap { margin-top: 24px; display: none; }
  .compare-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; text-align: center; }
  .compare {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
    background: #000;
    user-select: none;
    -webkit-user-select: none;
  }
  .compare img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }
  .compare .after-layer {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    overflow: hidden;
    width: 50%;
  }
  .compare .after-layer img { width: var(--compare-img-w, 100%); max-width: none; height: 100%; object-fit: cover; }
  .compare .handle {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 0;
    pointer-events: none;
  }
  .compare .handle-line {
    position: absolute; top: 0; bottom: 0; left: -1px;
    width: 2px; background: rgba(255,255,255,0.85);
  }
  .compare .handle-grip {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .compare .handle-grip svg { width: 16px; height: 16px; color: #111; }
  .compare .tag {
    position: absolute; bottom: 10px;
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 4px 9px;
    border-radius: 6px;
  }
  .compare .tag.before { left: 10px; }
  .compare .tag.after { right: 10px; }
  .compare input[type="range"] {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: ew-resize;
    margin: 0;
  }

  .disclaimer {
    font-size: 0.74rem;
    color: var(--muted-2);
    text-align: center;
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img id="logoImg" class="logo-img" src="/logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';" />
      <div id="logoFallback" class="logo-fallback">Proyecta tu Clínica</div>
      <div class="eyebrow">Uso interno · en consulta</div>
      <h1>Simulador de resultado</h1>
    </header>

    <div class="panel">
      <label class="field-label">Tipo de caso</label>
      <div class="segmented" id="segmented"></div>

      <label class="field-label">Foto del paciente</label>
      <div class="dropzone" id="dropzone">
        <input type="file" id="photoInput" accept="image/*" />
        <div id="dzContent">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div class="dz-text">Arrastra una foto o haz clic</div>
          <div class="dz-sub">JPG o PNG</div>
        </div>
      </div>

      <button id="generateBtn" disabled>Generar simulación</button>

      <div class="status-row" id="statusRow"></div>

      <div class="compare-wrap" id="compareWrap">
        <div class="compare-label">Desliza para comparar</div>
        <div class="compare" id="compare">
          <img id="beforeImg" alt="Antes" />
          <div class="after-layer" id="afterLayer">
            <img id="afterImg" alt="Después" />
          </div>
          <div class="handle" id="handle">
            <div class="handle-line"></div>
            <div class="handle-grip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 5l-5 7 5 7M16 5l5 7-5 7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <span class="tag before">Antes</span>
          <span class="tag after">Después</span>
          <input type="range" id="compareSlider" min="0" max="100" value="50" />
        </div>
      </div>

      <div class="disclaimer">Simulación orientativa generada por IA. No constituye un resultado clínico garantizado.</div>
    </div>
  </div>

<script>
  const segmented = document.getElementById("segmented");
  const dropzone = document.getElementById("dropzone");
  const dzContent = document.getElementById("dzContent");
  const photoInput = document.getElementById("photoInput");
  const generateBtn = document.getElementById("generateBtn");
  const statusRow = document.getElementById("statusRow");
  const compareWrap = document.getElementById("compareWrap");
  const beforeImg = document.getElementById("beforeImg");
  const afterImg = document.getElementById("afterImg");
  const afterLayer = document.getElementById("afterLayer");
  const handle = document.getElementById("handle");
  const compareSlider = document.getElementById("compareSlider");
  const compareEl = document.getElementById("compare");

  let selectedFile = null;
  let selectedCase = null;

  // ---- Carga los tipos de caso (definidos en prompts.js, backend) ----
  fetch("/api/cases")
    .then((r) => r.json())
    .then((cases) => {
      segmented.innerHTML = cases
        .map((c, i) => `<button type="button" data-value="${c.value}" class="${i === 0 ? "active" : ""}">${c.label}</button>`)
        .join("");
      selectedCase = cases[0]?.value || null;
      segmented.querySelectorAll("button").forEach((btn) => {
        btn.addEventListener("click", () => {
          segmented.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          selectedCase = btn.dataset.value;
        });
      });
    })
    .catch(() => {
      statusRow.textContent = "No se pudieron cargar los tipos de caso.";
    });

  // ---- Dropzone: click, drag & drop ----
  ["dragenter", "dragover"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("dragover"); })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("dragover"); })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    if (file) { photoInput.files = e.dataTransfer.files; handleFile(file); }
  });
  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];
    if (file) handleFile(file);
  });

  function handleFile(file) {
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      dzContent.innerHTML = `<img class="dz-preview" src="${e.target.result}" /><div class="dz-sub">${file.name}</div>`;
      dropzone.classList.add("has-file");
      generateBtn.disabled = false;
      statusRow.textContent = "";
      compareWrap.style.display = "none";
    };
    reader.readAsDataURL(file);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setStatus(html) { statusRow.innerHTML = html; }
  const loadingDots = `<span>Generando</span><div class="dots"><span></span><span></span><span></span></div>`;

  generateBtn.addEventListener("click", async () => {
    if (!selectedFile || !selectedCase) return;

    generateBtn.disabled = true;
    setStatus(loadingDots);
    compareWrap.style.display = "none";

    try {
      const imageBase64 = await fileToBase64(selectedFile);
      const res = await fetch("/api/simulate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          imageBase64,
          mimeType: selectedFile.type || "image/jpeg",
          caseValue: selectedCase
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error desconocido");

      beforeImg.src = URL.createObjectURL(selectedFile);
      afterImg.src = `data:${data.mimeType};base64,${data.imageBase64}`;
      compareWrap.style.display = "block";
      compareSlider.value = 50;
      requestAnimationFrame(initCompare);
      setStatus("Listo.");
    } catch (err) {
      setStatus("Error: " + err.message);
    } finally {
      generateBtn.disabled = false;
    }
  });

  // ---- Slider antes/despues ----
  function updateCompare(pct) {
    afterLayer.style.width = pct + "%";
    handle.style.left = pct + "%";
    const width = compareEl.clientWidth;
    afterImg.style.width = width + "px";
  }
  function initCompare() {
    updateCompare(compareSlider.value);
  }
  compareSlider.addEventListener("input", () => updateCompare(compareSlider.value));
  window.addEventListener("resize", () => { if (compareWrap.style.display !== "none") updateCompare(compareSlider.value); });
</script>
</body>
</html>
