<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Estadísticas · MicroStudioAI</title>
<link rel="icon" href="/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-1: #4728A2;
    --brand-2: #19A8B3;
    --bg: #141929;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #f5f6f8;
    --muted: #8b8f9a;
    --muted-2: #55585f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 56px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translateX(-50%);
    background: radial-gradient(circle, color-mix(in srgb, var(--brand-1) 22%, transparent) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { width: 100%; max-width: 720px; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 36px; }
  .logo-img { max-height: 64px; max-width: min(320px, 100%); margin: 0 auto 18px; display: block; }
  .eyebrow {
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
    font-weight: 600;
  }
  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 8px 0 0;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 22px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .totals-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 26px;
  }
  .stat-tile {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 20px;
  }
  .stat-tile .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-tile .value {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.6rem;
    font-weight: 600;
    background: linear-gradient(120deg, var(--brand-1), var(--brand-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--panel-border);
  }
  thead th:not(:first-child), tbody td:not(:first-child) { text-align: right; }
  tbody td {
    padding: 14px 10px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 0.92rem;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:first-child { font-weight: 600; }

  .status-msg {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 30px 0;
  }
  .status-msg.error { color: #ff9a9a; }

  .footer-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 24px;
  }
  .footer-links a, .footer-links button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.82rem;
    font-family: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .footer-links a:hover, .footer-links button:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img id="logoImg" class="logo-img" src="/logo.png" alt="Logo" onerror="this.style.display='none'" />
      <div class="eyebrow">Panel interno · Proyecta tu Clínica</div>
      <h1>Estadísticas de uso</h1>
    </header>

    <div class="panel">
      <div class="totals-row">
        <div class="stat-tile">
          <div class="label">Simulaciones totales</div>
          <div class="value" id="totalCount">—</div>
        </div>
        <div class="stat-tile">
          <div class="label">Importe generado</div>
          <div class="value" id="totalAmount">—</div>
        </div>
      </div>

      <div id="statusMsg" class="status-msg">Cargando datos...</div>

      <table id="statsTable" style="display:none;">
        <thead>
          <tr>
            <th>Clínica</th>
            <th>Simulaciones</th>
            <th>€ / simulación</th>
            <th>Importe</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>

    <div class="footer-links">
      <a href="/">Volver al simulador</a>
      <button id="logoutBtn" type="button">Cerrar sesión</button>
    </div>
  </div>

<script>
  function fmtEUR(n) {
    return new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(n || 0);
  }

  fetch("/api/admin/stats")
    .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
    .then(({ ok, data }) => {
      const statusMsg = document.getElementById("statusMsg");
      const table = document.getElementById("statsTable");

      if (!ok) {
        statusMsg.textContent = data.error || "No se pudieron cargar las estadísticas.";
        statusMsg.classList.add("error");
        return;
      }

      const clinics = data.clinics || [];
      if (!clinics.length) {
        statusMsg.textContent = "Todavía no hay simulaciones registradas.";
        return;
      }

      let totalCount = 0, totalAmount = 0;
      const rows = clinics.map((c) => {
        const count = Number(c.count) || 0;
        const price = Number(c.price) || 0;
        const amount = Number(c.amount) || count * price;
        totalCount += count;
        totalAmount += amount;
        return `<tr>
          <td>${c.clinic}</td>
          <td>${count}</td>
          <td>${fmtEUR(price)}</td>
          <td>${fmtEUR(amount)}</td>
        </tr>`;
      });

      document.getElementById("statsBody").innerHTML = rows.join("");
      document.getElementById("totalCount").textContent = totalCount;
      document.getElementById("totalAmount").textContent = fmtEUR(totalAmount);

      statusMsg.style.display = "none";
      table.style.display = "table";
    })
    .catch(() => {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.textContent = "Error de conexión al cargar las estadísticas.";
      statusMsg.classList.add("error");
    });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    try { await fetch("/logout", { method: "POST" }); } catch (e) {}
    window.location.href = "/login.html";
  });
</script>
</body>
</html>
